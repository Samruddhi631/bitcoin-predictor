name: Weekly Model Retrain

on:
  schedule:
    # Every Sunday at 2:00 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn \
                      xgboost yfinance requests

      - name: Check if retrain needed
        run: python ml/check_retrain.py

      - name: Commit new models if retrained
        run: |
          git config user.name  "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add api/models/*.pkl
          git diff --staged --quiet || \
            git commit -m \
            "Weekly model retrain $(date +'%Y-%m-%d')"
          git push