name: Daily Prediction Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn==1.6.1 \
                      xgboost yfinance requests

      - name: Run daily pipeline
        run: python ml/pipeline.py

      - name: Commit updated predictions
        run: |
          git config user.name  "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add api/data/predictions_log.csv || true
          git diff --staged --quiet || \
            git commit -m "Daily prediction $(date +'%Y-%m-%d')"
          git push || true