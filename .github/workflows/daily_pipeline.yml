name: Daily Prediction Pipeline

on:
  schedule:
    # Runs at 6:00 AM UTC every day
    - cron: '0 6 * * *'
  # Also allows manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. Install all Python packages
      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn \
                      xgboost yfinance requests \
                      python-dotenv

      # 4. Run your pipeline script
      - name: Run daily pipeline
        run: python ml/pipeline.py

      # 5. Save updated predictions.csv back to GitHub
      - name: Commit updated predictions
        run: |
          git config user.name  "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add api/data/predictions_log.csv
          git diff --staged --quiet || \
            git commit -m \
            "Daily prediction update $(date +'%Y-%m-%d')"
          git push